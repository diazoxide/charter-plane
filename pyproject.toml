[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "charter-cp"
version = "0.62.2"
description = "No longer maintained — charter is now a desktop app. Personas, workspaces and memory for coding agents across many repos."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["claude-code", "agents", "monorepo", "polyrepo", "developer-tools"]
authors = [{ name = "Aaron Yordanyan", email = "aaron.yor@gmail.com" }]
classifiers = [
  "Development Status :: 7 - Inactive",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  # POSIX, not "OS Independent", which is what this said and was not true: the harness
  # builds and drives a tmux session and writes its vaults at 0o600. Neither exists on
  # Windows, there is no Windows CI, and a vault guard was being asked to answer for a
  # platform charter does not run on (#476).
  "Operating System :: POSIX",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
]

# charter-cp is no longer maintained: charter is now a desktop app, whose repository took
# over the name `diazoxide/charter`, so the home page is the app's releases. This package's
# own source lives in `diazoxide/charter-plane`, whose `main` is a control plane: the code
# is at the tags.
[project.urls]
Homepage = "https://github.com/diazoxide/charter/releases"
Repository = "https://github.com/diazoxide/charter-plane"
Source = "https://github.com/diazoxide/charter-plane/tree/v0.62.2"
Issues = "https://github.com/diazoxide/charter/issues"
Changelog = "https://github.com/diazoxide/charter-plane/releases"

[project.scripts]
charter = "charter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["charter"]

# `charter docs show <topic>` serves these, so they must travel with the code: the wheel
# ships `charter/`, and `docs/` is outside it. Listed page by page rather than as a whole
# directory so `adr/`, `audits/` and `superpowers/` — design record and working notes —
# stay out of every user's site-packages. Adding a page here is not optional:
# tests/test_docs_show.py fails on a `docs/*.md` that is not force-included, because the
# gap is invisible from a checkout, where the fallback reads the repo and looks fine.
[tool.hatch.build.targets.wheel.force-include]
"docs/browser.md" = "charter/_docs/browser.md"
"docs/changes.md" = "charter/_docs/changes.md"
"docs/control-plane.md" = "charter/_docs/control-plane.md"
"docs/forges.md" = "charter/_docs/forges.md"
"docs/frame.md" = "charter/_docs/frame.md"
"docs/git-policy.md" = "charter/_docs/git-policy.md"
"docs/handoff.md" = "charter/_docs/handoff.md"
"docs/harnesses.md" = "charter/_docs/harnesses.md"
"docs/hooks.md" = "charter/_docs/hooks.md"
"docs/install.md" = "charter/_docs/install.md"
"docs/mcp.md" = "charter/_docs/mcp.md"
"docs/personas.md" = "charter/_docs/personas.md"
"docs/secrets.md" = "charter/_docs/secrets.md"
"docs/workspaces.md" = "charter/_docs/workspaces.md"

# News entries, mapped as a DIRECTORY rather than page by page. The listing above is
# deliberate — it keeps `adr/`, `audits/` and `superpowers/` out of every user's
# site-packages — and news has no such exclusion: every entry is meant to ship, and a
# per-release edit here is one more thing a release can forget. `tests/test_news.py`
# fails if what ships cannot be read back.
"docs/news" = "charter/_news"
